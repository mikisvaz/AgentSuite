---
scenario: C02
class: contrived
description: 'Stale-failure etiquette: subtly stale context (one wrong middle context
  line) must be refused; tree stays pristine; no rescue writes/bash after the failed
  patch'
patch: patch.txt
functional:
  expect_files:
    list.txt: match
  reject_residue: true
message_rules:
  tool: patch
  min_calls: 1
  max_calls: 2
  expect:
    applied: false
    output_contains:
    - FAILED
  max_total_calls: 6
  forbid_after_failed:
  - write
  - bash
  - python
  - ruby
  - r
  - copy
  - delete
